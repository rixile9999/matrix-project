<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF workspace · Matrix</title>
<style>
:root{color-scheme:light;--bg:#f7f7f2;--paper:#fffdf7;--ink:#20291f;--muted:#586155;--line:#cbd0c4;--blue:#2d468f;--deep:#202e4c;--yellow:#edf28b;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--body:"DM Sans","Apple SD Gothic Neo",Arial,sans-serif;--serif:"Instrument Serif",Georgia,"AppleMyungjo",Batang,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.43 var(--body);word-break:keep-all}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #728ce1;outline-offset:3px}
header{border-bottom:1px solid var(--line);background:#fafaf6}
nav,main{width:min(1192px,calc(100% - 80px));margin:auto}
nav,.row,.between,.sourcebar,.deskfoot,.sheetfoot{display:flex;align-items:center;gap:12px}
.between,.sourcebar,.deskfoot,.sheetfoot{justify-content:space-between}
nav{min-height:68px}
.logo{display:inline-grid;grid-template-columns:repeat(3,5px);gap:3px;transform:skewY(-9deg)}
.logo i{height:5px;background:currentColor}.logo i:nth-child(3),.logo i:nth-child(7){opacity:.28}
.brand{font-size:22px;letter-spacing:-1.4px;font-weight:750}
.crumb{margin-left:14px;padding-left:22px;border-left:1px solid var(--line);color:var(--muted)}
.lang{display:flex;padding:3px;background:#eeeFE8;border:1px solid var(--line);border-radius:7px;margin-left:auto}
.lang button{background:none;border:0;border-radius:4px;font-size:12px;padding:4px 10px}.lang [aria-pressed=true]{background:white;box-shadow:0 1px 3px #212a2026;font-weight:bold}
main{padding:34px 0 45px}
h1,h2,h3,p{margin:0}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
h1{font:normal clamp(43px,5vw,65px)/1.08 var(--serif);letter-spacing:-.055em}
html[lang=ko] h1{font-size:clamp(36px,4.5vw,55px);letter-spacing:-.075em}
.intro p{color:var(--muted);margin-top:6px}
.steps{display:flex;gap:18px;list-style:none;padding:0;margin:0 0 4px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:7px;color:#697166;font-size:13px}
.steps b{border-radius:50%;height:22px;min-width:22px;display:grid;place-items:center;border:1px solid var(--line);font:11px var(--mono)}
.steps [aria-current=step]{color:var(--blue);font-weight:700}.steps [aria-current=step] b{background:var(--blue);color:white;border-color:var(--blue)}
.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,.92fr);align-items:start;gap:22px}
.viewer,.panel{border-radius:14px;overflow:hidden;min-width:0}
.viewer{background:var(--deep);color:#f4f5fb;border:1px solid #26334d}
.sourcebar,.deskfoot{padding:14px 20px;background:#23314b}
.sourcebar{border-bottom:1px solid #45506a}
.sourcebar button,.deskfoot button{background:transparent;color:inherit;border:1px solid #758197;border-radius:5px;padding:5px 10px;font-size:13px}
.source-name{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:600}.filemark{font:10px var(--mono);letter-spacing:.06em;border:1px solid #8490a4;color:#f5f1e6;border-radius:3px;padding:4px}
.desk{position:relative;display:grid;place-items:center;min-height:415px;padding:28px 42px 25px;background-color:#344461;background-image:radial-gradient(#7a899c66 .8px,transparent 1px);background-size:12px 12px}
.sheet{background:var(--paper);color:#2a2f29;position:relative;width:min(100%,420px);padding:24px 31px 17px;box-shadow:4px 5px 0 -1px #d4d9d5,8px 10px 0 -2px #96a2ae,0 8px 23px #17213970;border-top:4px solid #243d77}
.sheethead,.sheetfoot,.smallcap,.tag,.metric{font:11px/1.5 var(--mono)}
.sheethead,.smallcap{letter-spacing:.09em;text-transform:uppercase}
.sheethead{color:#535c67;border-bottom:1px solid #b6b9af;padding-bottom:10px}
.sheet h2{font:normal clamp(26px,3vw,38px)/1.08 var(--serif);letter-spacing:-.05em;margin:18px 0 9px;color:#232c3c}
.sheet p{font:14px/1.52 var(--serif);margin-bottom:10px}.sheet table{border-collapse:collapse;width:100%;font-size:12px;margin:10px 0}
.sheet th,.sheet td{padding:5px 0;border-bottom:1px solid #d4d6ca;text-align:right;font-variant-numeric:tabular-nums}
.sheet th:first-child{text-align:left;font-weight:normal}.sheet thead th{font:10px var(--mono);color:#4e5961}
.equation{font:italic 17px/1.6 var(--serif);background:linear-gradient(transparent 50%,#e6edab 50%,#e6edab 93%,transparent 93%);color:#243d77}
.sheetfoot{border-top:1px solid #b6b9af;margin-top:16px;padding-top:7px;color:#535c67}
.deskfoot{font-size:12px;color:#e1e6ee}.deskfoot .row{gap:9px}.deskfoot button{font-size:15px;min-width:30px;padding:2px}
.panel{padding:25px;background:#fffefa;border:1px solid var(--line);box-shadow:0 2px 5px #25301f07}
.panel h2{font:normal 34px/1.12 var(--serif);letter-spacing:-.045em}
.tag{padding:3px 9px;background:#eff2d8;border-radius:4px;color:#40512a;white-space:nowrap}
.section{margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}
h3{font-size:15px;font-weight:650;margin-bottom:8px}
.range{display:flex;align-items:center;gap:10px}
.range label{flex:1;font-size:12px;color:var(--muted)}
input[type=number],input[type=text]{border:1px solid #acb5a5;border-radius:5px;padding:6px 9px;background:white;width:100%;margin-top:3px}
.targets{display:grid;gap:6px}
.choice{border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:14px}
.choice:has(input:checked){background:#f1f4f8;border-color:#b9c4db}
input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;flex:none}
.metric{margin-left:auto;white-space:nowrap;color:var(--muted)}
.actions{margin-top:19px;display:grid;gap:8px}
.primary,.secondary{padding:10px 15px;border-radius:6px;font-weight:650;border:1px solid var(--line)}
.primary{background:var(--blue);color:white;border-color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.secondary{background:#f7f8f3}
.note,.status{font-size:13px;color:var(--muted)}.status{color:#873d21}
details{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
summary{cursor:pointer;font-weight:600}details p{margin-top:7px}
.reviewitem{margin-top:12px;border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.reviewitem .row{align-items:flex-start;gap:8px;font-weight:600}
.reviewitem details{margin-top:6px;padding:5px 0;border:0}
.linkbtn{border:0;background:transparent;color:var(--blue);padding:3px 0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.external{color:var(--paper);text-align:center;max-width:320px}
.external a{color:var(--yellow)} .external p{margin:.7em 0}
.footer{margin-top:17px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#798b58}
@media(max-width:850px){.intro{display:block}.steps{margin-top:16px}.workspace{grid-template-columns:minmax(0,1.08fr) minmax(280px,1fr);gap:14px}main,nav{width:calc(100% - 36px)}.desk{padding-inline:19px}.sheet{padding-inline:19px}.panel{padding:18px}}
@media(max-width:650px){nav{min-height:52px}.crumb{margin-left:0;padding-left:10px;font-size:12px}main{padding-top:22px}.workspace{grid-template-columns:1fr}.intro{margin-bottom:14px}.desk{min-height:0;padding:20px 27px}.sheet{max-width:360px}.sheet h2{margin-top:11px}.sourcebar,.deskfoot{padding:10px 14px}.panel{padding:20px}.steps{gap:10px}.steps li{font-size:12px}.footer{align-items:flex-start}nav,.row{gap:8px}}
</style>
</head>
<body>
<header><nav><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand">Matrix</span><span class="crumb" id="crumb"></span><div class="lang"><button id="english" lang="en">EN</button><button id="korean" lang="ko">한국어</button></div></nav></header>
<main><div class="intro"><div><h1 id="title"></h1><p id="subtitle"></p></div><ol class="steps" id="steps"></ol></div>
<div class="workspace"><section class="viewer"><div class="sourcebar"><div class="row"><span class="filemark">PDF</span><span class="source-name" id="filename"></span></div><button id="fileButton"></button><input type="file" accept=".pdf,application/pdf" hidden id="file"></div><div class="desk" id="desk"></div><div class="deskfoot"><span id="sourceType"></span><div class="row" id="pager"></div></div></section>
<section class="panel" id="panel" aria-labelledby="panelTitle"></section></div><p class="footer"><span class="dot" aria-hidden="true"></span><span id="demo"></span></p><p role="status" id="announcement"></p></main>
<script>
const samplePages = [
  {
    page: 12,
    topic: ["Prior probability", "사전확률"],
    heading: ["Before inspection", "검사 전 불량률"],
    paragraph: [
      "A batch contains 1,000 items, including 20 defective ones. Before seeing the inspection result, the chance that a randomly chosen item is defective is the fraction of defective items in the batch.",
      "제품 1,000개 중 20개가 불량입니다. 검사 결과를 보기 전에 무작위로 고른 제품이 불량일 확률은 전체 제품 중 불량품의 비율입니다."
    ],
    formula: "P(D) = 20 / 1,000",
    question: [
      "A batch of 1,000 items contains 20 defective items. What is the probability that a randomly chosen item is defective? Give your answer as a decimal.",
      "제품 1,000개 중 20개가 불량입니다. 무작위로 고른 제품이 불량일 확률은 얼마인가요? 소수로 답하세요."
    ],
    hint: [
      "Divide the number of defective items by the total number of items.",
      "불량품 수를 전체 제품 수로 나누세요."
    ],
    solution: [
      "There are 20 defective items out of 1,000, so the probability is 20 ÷ 1,000 = 0.02.",
      "전체 1,000개 중 20개가 불량이므로 확률은 20 ÷ 1,000 = 0.02입니다."
    ],
    answer: 0.02
  },
  {
    page: 13,
    topic: ["Total probability", "전체 확률"],
    heading: ["When inspection flags an item", "검사에서 표시된 제품"],
    paragraph: [
      "The inspection flags 19 of the 20 defective items and 49 of the 980 good ones. Both groups count toward the overall chance of an item being flagged.",
      "검사에서 불량품 20개 중 19개, 정상 제품 980개 중 49개에 표시가 붙습니다. 제품에 표시가 붙을 전체 확률을 구하려면 두 집단을 모두 셉니다."
    ],
    formula: "P(F) = (19 + 49) / 1,000",
    question: [
      "In a batch of 1,000 items, inspection flags 19 defective items and 49 good items. What is the probability that a randomly chosen item is flagged? Give your answer as a decimal.",
      "제품 1,000개를 검사한 결과, 불량품 19개와 정상 제품 49개에 표시가 붙었습니다. 무작위로 고른 제품에 표시가 붙어 있을 확률은 얼마인가요? 소수로 답하세요."
    ],
    hint: [
      "Count every flagged item, including the good items.",
      "정상 제품을 포함해 표시가 붙은 제품을 모두 세세요."
    ],
    solution: [
      "The inspection flags 19 + 49 = 68 items, so the probability is 68 ÷ 1,000 = 0.068.",
      "표시가 붙은 제품은 19 + 49 = 68개이므로 확률은 68 ÷ 1,000 = 0.068입니다."
    ],
    answer: 0.068
  },
  {
    page: 14,
    topic: ["Posterior probability", "사후확률"],
    heading: ["What a flag tells you", "검사 표시가 알려 주는 것"],
    paragraph: [
      "Once you know an item was flagged, compare the defective items with all flagged items. Of the 68 items flagged, 19 are defective.",
      "제품에 표시가 붙었다는 사실을 알면, 표시가 붙은 제품 중 불량품의 비율을 구합니다. 표시된 68개 중 19개가 불량입니다."
    ],
    formula: "P(D | F) = 19 / (19 + 49)",
    question: [
      "Inspection flags 19 defective items and 49 good items. If you choose one of the flagged items at random, what is the probability that it is defective? Round to three decimal places.",
      "검사에서 불량품 19개와 정상 제품 49개에 표시가 붙었습니다. 표시가 붙은 제품 중 하나를 무작위로 고르면 불량일 확률은 얼마인가요? 소수점 셋째 자리까지 반올림해 답하세요."
    ],
    hint: [
      "Use the number of flagged items as the denominator.",
      "표시가 붙은 제품 수를 분모로 쓰세요."
    ],
    solution: [
      "Of the 19 + 49 = 68 flagged items, 19 are defective. The probability is 19 ÷ 68 ≈ 0.279.",
      "표시가 붙은 19 + 49 = 68개 중 19개가 불량입니다. 확률은 19 ÷ 68 ≈ 0.279입니다."
    ],
    answer: 0.279
  }
];
const $ = id => document.getElementById(id);
const state = {
  lang: 0, step: 0, page: 12, from: 12, to: 14,
  goals: new Set([12,13,14]), retained: new Set(), expanded:new Set(),
  sharing: false, consent: false, requested: false, local: null
};
const t = (en,ko) => state.lang ? ko : en;
const copy = pair => pair[state.lang];
const pg = n => t('p. '+n,n+'쪽');
function pagesInRange() {
  if (!Number.isInteger(state.from) || !Number.isInteger(state.to) ||
      state.from < 12 || state.to > 14 || state.from > state.to) return [];
  return samplePages.filter(p=>p.page>=state.from && p.page<=state.to);
}
function draw() {
  document.documentElement.lang=t('en','ko');
  document.title=t('PDF workspace · Matrix','PDF 작업실 · Matrix');
  $('english').setAttribute('aria-pressed',!state.lang);
  $('korean').setAttribute('aria-pressed',!!state.lang);
  $('crumb').textContent=t('My Library','내 자료');
  $('title').textContent=t('PDF workspace','PDF 작업실');
  $('subtitle').textContent=t('Build a practice set from the pages you’re studying.','공부하고 있는 페이지로 나만의 문제집을 만드세요.');
  $('steps').innerHTML=[t('Select pages','범위 선택'),t('Review','문제 검토'),t('My set','내 문제집')].map((s,i)=>
    '<li '+(state.step===i?'aria-current="step"':'')+'><b>'+ (i<state.step?'✓':i+1)+'</b>'+s+'</li>').join('');
  $('demo').textContent=t('Interactive sample · Changes last until you reload.','인터랙티브 시안 · 새로고침 전까지 변경사항이 유지됩니다.');
  drawViewer(); drawPanel();
}
function drawViewer() {
  $('fileButton').textContent=t('Choose PDF','PDF 선택');
  $('filename').textContent=state.local?.name ?? 'probability-notes.pdf';
  if (state.local) {
    $('sourceType').textContent=t('Local preview','로컬 미리보기');
    $('pager').innerHTML='';
    $('desk').innerHTML='<div class="external"><h2>'+t('Your document','내 문서')+'</h2><p>'+t('Open the PDF on this device. The practice flow is available with the sample document.','이 기기에서 PDF를 열어 보세요. 문제 생성 흐름은 예제 문서로 체험할 수 있습니다.')+'</p><a id="externalLink" target="_blank" rel="noopener">'+t('Open local PDF ↗','내 PDF 열기 ↗')+'</a></div>';
    $('externalLink').href=state.local.url;
    return;
  }
  const p=samplePages.find(p=>p.page===state.page);
  $('sourceType').textContent=t('Sample excerpt · pp. 12–14','예제 발췌본 · 12–14쪽');
  $('pager').innerHTML='<button id="prev" aria-label="'+t('Previous page','이전 페이지')+'" '+(p.page===12?'disabled':'')+'>‹</button><span>'+pg(p.page)+'</span><button id="next" aria-label="'+t('Next page','다음 페이지')+'" '+(p.page===14?'disabled':'')+'>›</button>';
  $('desk').innerHTML='<article class="sheet"><div class="sheethead">'+t('Probability notes / Conditional probability','확률 노트 / 조건부확률')+'</div><h2>'+copy(p.heading)+'</h2><p>'+copy(p.paragraph)+'</p><table><thead><tr><th>'+t('Inspection','검사 결과')+'</th><th>'+t('Defective','불량품')+'</th><th>'+t('Good','정상품')+'</th></tr></thead><tbody><tr><th>'+t('Flagged','양성')+'</th><td>19</td><td>49</td></tr><tr><th>'+t('Unflagged','음성')+'</th><td>1</td><td>931</td></tr></tbody></table><span class="equation">'+p.formula+'</span><div class="sheetfoot"><span>'+t('Quality control','품질 관리')+'</span><span>'+p.page+'</span></div></article>';
  $('prev').onclick=()=>turnPage(-1); $('next').onclick=()=>turnPage(1);
}
function turnPage(by) {
  state.page+=by; drawViewer();
  const button=$(by>0?'next':'prev');
  (button.disabled?$(by>0?'prev':'next'):button).focus();
}
function title(text,tag) {
  return '<div class="between"><h2 id="panelTitle" tabindex="-1">'+text+'</h2><span class="tag">'+tag+'</span></div>';
}
function action(id,label) {
  return '<button class="primary" id="'+id+'"><span>'+label+'</span><span aria-hidden="true">→</span></button>';
}
function advance(step) {
  state.step=step; draw(); $('panelTitle').focus();
}
function drawPanel() {
  if (state.local) {
    $('panel').innerHTML=title(t('Local PDF','내 PDF'),t('Private','비공개'))+'<p class="section">'+t('Nothing is uploaded. Return to the three-page sample to try generating a practice set.','선택한 파일은 기기에 유지됩니다. 세 페이지짜리 예제로 돌아가 문제집을 만들어 보세요.')+'</p><div class="actions">'+action('restore',t('Use sample document','예제 문서로 돌아가기'))+'</div>';
    $('restore').onclick=()=>{URL.revokeObjectURL(state.local.url);state.local=null;draw();}; return;
  }
  if (state.step===0) {
    $('panel').innerHTML=title(t('Practice set','문제집 설정'),t('Free beta','무료 베타'))+'<div class="section"><h3>'+t('Page range','페이지 범위')+'</h3><div class="range">'+
      ['from','to'].map((id,i)=>'<label>'+ (i?t('To','끝'):t('From','시작'))+'<input id="'+id+'" type="number" min="12" max="14" value="'+(Number.isFinite(state[id])?state[id]:'')+'"></label>').join('<span aria-hidden="true">—</span>')+
      '</div></div><div class="section"><h3>'+t('Learning goals','학습 목표')+'</h3><div class="targets" id="targets"></div></div><div class="actions">'+action('generate',t('Generate questions','문제 생성'))+'<span class="note" id="summary" aria-live="polite"></span></div>';
    for (const id of ['from','to']) $(id).oninput=e=>{state[id]=e.target.valueAsNumber; drawGoals();};
    drawGoals();
    $('generate').onclick=()=>{
      state.retained=new Set(pagesInRange().filter(p=>state.goals.has(p.page)).map(p=>p.page));
      state.expanded=new Set([Array.from(state.retained)[0]]);
      state.page=Array.from(state.retained)[0]; advance(1);
    };
  } else if (state.step===1) drawReview();
  else drawSaved();
}
function drawGoals() {
  const available=pagesInRange();
  $('targets').innerHTML=available.map(p=>'<label class="choice"><input type="checkbox" data-goal="'+p.page+'" '+(state.goals.has(p.page)?'checked':'')+'>'+copy(p.topic)+'<span class="metric">'+pg(p.page)+'</span></label>').join('');
  function updateCount() {
    const n=available.filter(p=>state.goals.has(p.page)).length;
    $('generate').disabled=n===0;
    $('summary').textContent=available.length ? t(n+' selected · Only visible to you',n+'개 선택 · 나에게만 표시') : t('Choose a range within pages 12–14.','12~14쪽 안에서 범위를 선택하세요.');
  }
  $('targets').onchange=e=>{
    const k=Number(e.target.dataset.goal);
    if (e.target.checked) state.goals.add(k); else state.goals.delete(k);
    updateCount();
  };
  updateCount();
}
function drawReview() {
  const rows=pagesInRange().filter(p=>state.goals.has(p.page));
  $('panel').innerHTML=title(t('Review questions','문제 검토'),t('Draft','초안'))+
    rows.map(p=>'<div class="reviewitem"><label class="row"><input type="checkbox" data-keep="'+p.page+'" '+(state.retained.has(p.page)?'checked':'')+'>'+copy(p.topic)+'</label><details data-details="'+p.page+'" '+(state.expanded.has(p.page)?'open':'')+'><summary>'+t('Question & solution','문제와 해설')+'</summary><p>'+copy(p.question)+'</p><p><b>'+t('Hint','힌트')+'</b> · '+copy(p.hint)+'</p><p>'+copy(p.solution)+'</p><button class="linkbtn" data-source="'+p.page+'">'+t('View source','근거 보기')+' · '+pg(p.page)+'</button></details></div>').join('')+
    '<div class="actions">'+action('save',t('Save private set','개인 문제집에 저장'))+'<button class="secondary" id="back">'+t('Edit selection','범위·목표 수정')+'</button></div>';
  $('save').disabled=!state.retained.size;
  for (const box of $('panel').querySelectorAll('[data-keep]')) box.onchange=()=>{
    const n=Number(box.dataset.keep); if(box.checked)state.retained.add(n);else state.retained.delete(n);
    $('save').disabled=!state.retained.size;
  };
  for (const det of $('panel').querySelectorAll('[data-details]')) det.ontoggle=()=>{
    if (!det.isConnected) return;
    const n=Number(det.dataset.details); if(det.open)state.expanded.add(n);else state.expanded.delete(n);
  };
  for (const btn of $('panel').querySelectorAll('[data-source]')) btn.onclick=()=>{
    state.page=Number(btn.dataset.source); drawViewer(); $('desk').scrollIntoView({block:'nearest'});
  };
  $('back').onclick=()=>advance(0);
  $('save').onclick=()=>advance(2);
}
function drawSaved() {
  const selected=samplePages.filter(p=>state.retained.has(p.page));
  $('panel').innerHTML=title(t('My practice set','내 문제집'),t('Private','비공개'))+
    '<div class="section"><h3>'+t('Conditional probability','조건부확률')+'</h3><p class="note">'+t(selected.length+' saved · Practice in this preview',selected.length+'문항 저장 · 시안에서 풀어보기')+'</p></div>'+
    selected.map(p=>'<details class="quiz" data-page="'+p.page+'"><summary>'+copy(p.topic)+'</summary><p>'+copy(p.question)+'</p><form><label>'+t('Decimal answer','소수로 답하기')+'<input inputmode="decimal" type="text" required></label><button class="linkbtn">'+t('Check answer','정답 확인')+'</button></form><p role="status"></p></details>').join('')+
    '<div class="section"><h3>'+t('Share this set','문제집 공개')+'</h3><p class="note">'+t('Free during beta. Planned pricing per set: private x, approved public set x/2. The original PDF stays private.','베타 기간에는 무료입니다. 유료화 후 문제집당 개인 이용은 x, 공개 승인은 x/2입니다. 원본 PDF는 비공개로 유지됩니다.')+'</p><div class="actions" id="share"></div></div>';
  for (const quiz of $('panel').querySelectorAll('.quiz')) {
    const p=samplePages.find(p=>p.page===Number(quiz.dataset.page));
    quiz.querySelector('form').onsubmit=e=>{
      e.preventDefault();
      const v=quiz.querySelector('input').value.trim();
      quiz.querySelector('[role=status]').textContent=(v && Math.abs(Number(v)-p.answer)<0.000001) ? t('Correct. ','정답입니다. ')+copy(p.solution) : copy(p.hint);
    };
  }
  drawShare();
}
function drawShare() {
  if (state.requested) {
    $('share').innerHTML='<strong>'+t('Review requested','공개 검토 신청됨')+'</strong><span class="note">'+t('Private while awaiting approval.','승인 전까지 비공개입니다.')+'</span>'; return;
  }
  if (!state.sharing) {
    $('share').innerHTML='<button class="secondary" id="startShare">'+t('Request publication','공개 신청')+'</button>';
    $('startShare').onclick=()=>{state.sharing=true;drawShare();$('consent').focus();}; return;
  }
  $('share').innerHTML='<label class="choice"><input type="checkbox" id="consent" '+(state.consent?'checked':'')+'>'+t('I have permission to share the material used in these questions.','문항에 사용한 자료를 공유할 권한이 있습니다.')+'</label>'+action('request',t('Submit for review','공개 검토 요청'))+'<button class="linkbtn" id="cancel">'+t('Keep private','비공개 유지')+'</button>';
  $('request').disabled=!state.consent;
  $('consent').onchange=e=>{state.consent=e.target.checked;$('request').disabled=!state.consent;};
  $('request').onclick=()=>{state.requested=true;drawShare();};
  $('cancel').onclick=()=>{state.sharing=false;state.consent=false;drawShare();};
}
function language(lang) {
  const quizState = [...$('panel').querySelectorAll('.quiz')].map(q=>({open:q.open,value:q.querySelector('input').value,checked:!!q.querySelector('[role=status]').textContent}));
  state.lang=lang;draw();
  [...$('panel').querySelectorAll('.quiz')].forEach((q,i)=>{
    q.open=quizState[i].open;q.querySelector('input').value=quizState[i].value;
    if(quizState[i].checked)q.querySelector('form').requestSubmit();
  });
}
$('english').onclick=()=>language(0); $('korean').onclick=()=>language(1);
$('fileButton').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  e.target.value='';
  if (!/\.pdf$/i.test(file.name)) { $('announcement').textContent=t('Choose a PDF file.','PDF 파일을 선택하세요.');return; }
  $('announcement').textContent='';
  if(state.local)URL.revokeObjectURL(state.local.url);
  state.local={name:file.name,url:URL.createObjectURL(new Blob([file],{type:'application/pdf'}))};draw();
};
draw();
</script>
</body>
</html>
