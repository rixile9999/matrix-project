<!doctype html>
<html lang="ko" data-look="arena">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The look (arena | light) is applied before the first paint so there is no flash of the other one.
			try { document.documentElement.dataset.look = localStorage.getItem('look') === 'light' ? 'light' : 'arena'; } catch (e) { /* storage unavailable: arena */ }
		</script>
		<title>Matrix Trainer</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
